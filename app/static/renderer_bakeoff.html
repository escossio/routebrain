<!doctype html>
<html lang="pt-BR">

    <title>RouteBrain Renderer Bake-off</title>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #102033;
        --muted: #5c6b7c;
        --line: #d8e0ea;
        --line-strong: #aebccc;
        --panel: #f7f9fc;
        --accent: #0f62fe;
        --accent-soft: #dce9ff;
        --good: #0f7a4a;
        --warn: #9a6700;
        --bad: #b42318;
        --shadow: 0 12px 30px rgba(16, 32, 51, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(180deg, #fff 0%, #f6f9fc 100%);
        color: var(--ink);
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { max-width: 1540px; margin: 0 auto; padding: 24px; }
      .hero, .footer, .scoreboard, .bakeoff-card, .tabbar { background: var(--bg); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
      .hero { padding: 20px 22px; display: flex; gap: 16px; justify-content: space-between; align-items: end; }
      h1 { margin: 2px 0 8px; font-size: 30px; line-height: 1.05; letter-spacing: -0.04em; }
      .eyebrow { margin: 0; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; }
      .subtitle { margin: 0; color: var(--muted); max-width: 76ch; }
      .meta { text-align: right; color: var(--muted); max-width: 34ch; }
      .tabbar { margin-top: 18px; display: flex; gap: 8px; padding: 8px; position: sticky; top: 10px; z-index: 5; }
      .tabbutton { appearance: none; border: 1px solid transparent; border-radius: 14px; padding: 12px 16px; background: transparent; color: var(--muted); font-weight: 700; cursor: pointer; flex: 1; }
      .tabbutton[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); border-color: #bcd3ff; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
      .bakeoff-card { padding: 16px; min-height: 820px; display: flex; flex-direction: column; }
      .bakeoff-card.active { border-color: #9ec2ff; box-shadow: 0 18px 36px rgba(16, 32, 51, 0.12); }
      .card-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; margin-bottom: 12px; }
      .card-head h2 { margin: 4px 0 4px; font-size: 22px; }
      .card-head p { margin: 0; color: var(--muted); }
      .badge { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 7px 11px; font-size: 12px; font-weight: 700; background: #eef4ff; color: #2449b3; }
      .canvas { position: relative; flex: 1; min-height: 470px; border-radius: 18px; border: 1px solid var(--line); background: #fff; overflow: hidden; }
      .footnotes { margin-top: 12px; display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .note { padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
      .note strong { display: block; margin-bottom: 4px; }
      .spec { display: grid; gap: 6px; font-size: 13px; }
      .scoreboard { margin-top: 16px; padding: 16px 18px; }
      .scoreboard h3 { margin: 0 0 10px; font-size: 18px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-top: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: top; }
      th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
      .final { margin-top: 16px; padding: 16px 18px; border-radius: 20px; border: 1px solid #c8dbff; background: linear-gradient(180deg, #f4f8ff, #ffffff); }
      .final strong { display: block; margin-bottom: 6px; }
      .tag { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 8px; background: #eef2f7; color: var(--muted); font-size: 12px; margin-right: 6px; }
      .topology-svg { width: 100%; height: 100%; display: block; }
      .svg-node { filter: drop-shadow(0 8px 18px rgba(16, 32, 51, 0.12)); }
      .svg-panel-text { font: 600 13px system-ui, sans-serif; fill: #122033; }
      .svg-small { font: 12px system-ui, sans-serif; fill: #5c6b7c; }
      .svg-hops { font: 700 13px system-ui, sans-serif; fill: #0f62fe; }
      .reactflow-wrap, .cy-wrap { width: 100%; height: 100%; }
      .placeholder {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: var(--muted); text-align: center; padding: 24px; background: repeating-linear-gradient(135deg, rgba(15,98,254,0.03) 0 14px, rgba(15,98,254,0.01) 14px 28px);
      }
      .placeholder strong { color: var(--ink); display: block; margin-bottom: 6px; }
      @media (max-width: 1200px) { .grid { grid-template-columns: 1fr; } .bakeoff-card { min-height: 760px; } }

          React.createElement("footer", { className: "footer", style: { marginTop: "16px", padding: "14px 18px", color: "var(--muted)" } }, "Abertura: /static/renderer_bakeoff.html | sem chamadas ao backend RouteBrain | topo fixo: Local -> Privado -> ASN desconhecido -> Destino")
        );
      }

      ReactDOM.createRoot(document.getElementById("app")).render(React.createElement(App));
    </script>
